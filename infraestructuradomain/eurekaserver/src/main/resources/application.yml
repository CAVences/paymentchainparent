spring:
  application:
    name: eureka-server
  cloud:
    config:
      enabled: false
server:
  port: 8761
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    renewal-percent-threshold: 0.85
    enable-self-preservation: true
  instance:
    lease-expiration-duration-in-seconds: 10

