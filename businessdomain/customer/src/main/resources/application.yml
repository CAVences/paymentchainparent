spring:
  application:
    name: "businessdomain-customer"
  config:
    import:
      - "optional:configserver:http://localhost:8888"
  cloud:
    config:
      name: config-client-customer
      profile: dev
      discovery:
        enabled: true
      enabled: true

server:
  port: 8081
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: true
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: "*"